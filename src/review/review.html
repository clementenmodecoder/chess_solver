<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Lens — Game Review</title>
    <style>
      :root {
        --bg: #161513;
        --panel: #1f1d1a;
        --panel2: #26231f;
        --text: #ece7df;
        --muted: #8f8a82;
        --line: rgba(255, 255, 255, 0.07);
        --accent: #58b368;
        --brilliant: #1baca6;
        --great: #5b8bb0;
        --best: #81b64c;
        --excellent: #96bc4b;
        --good: #96af8b;
        --book: #a88865;
        --inaccuracy: #f7c631;
        --mistake: #ffa459;
        --miss: #ff7769;
        --blunder: #fa412d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px;
      }
      header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
      header .sub { color: var(--muted); font-size: 12px; }
      main { display: grid; grid-template-columns: minmax(320px, 620px) minmax(340px, 1fr); gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      .card { background: var(--panel); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px; }
      .import textarea { width: 100%; min-height: 140px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
      .btn { cursor: pointer; border: none; border-radius: 9px; padding: 8px 14px; background: rgba(255,255,255,.08); color: var(--text); font-weight: 600; font-size: 13px; }
      .btn:hover { background: rgba(255,255,255,.14); }
      .btn.primary { background: var(--accent); color: #0c1a0e; }
      .btn.primary:disabled { opacity: .5; cursor: default; }
      select, input[type=file] { color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
      .hint { color: var(--muted); font-size: 12px; }
      .progress { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin-top: 10px; }
      .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
      .board { width: 100%; height: auto; border-radius: 8px; display: block; }
      .board-wrap { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
      .evalbar { background: #3b3733; border-radius: 8px; overflow: hidden; position: relative; }
      .evalbar .w { position: absolute; left: 0; right: 0; bottom: 0; background: #f5f2ec; height: 50%; transition: height .35s; }
      .nav { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
      .nav .btn { padding: 6px 12px; }
      .movenote { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--panel2); min-height: 44px; display: flex; gap: 10px; align-items: center; }
      .movenote .cls { font-weight: 800; padding: 2px 8px; border-radius: 6px; color: #111; white-space: nowrap; }
      .summary { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
      .summary .player { text-align: center; }
      .summary .acc { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
      .summary .name { color: var(--muted); font-size: 12px; }
      .summary .vs { color: var(--muted); font-size: 12px; }
      table.counts { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
      table.counts td { padding: 4px 6px; border-top: 1px solid var(--line); }
      table.counts td.n { text-align: center; font-weight: 700; width: 48px; }
      table.counts td.l { text-align: center; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      canvas.graph { width: 100%; height: 120px; display: block; background: var(--panel2); border-radius: 10px; }
      .moves { display: grid; grid-template-columns: 44px 1fr 1fr; font-size: 13px; max-height: 420px; overflow: auto; border-radius: 10px; background: var(--panel2); }
      .moves .num { color: var(--muted); padding: 5px 8px; border-top: 1px solid var(--line); }
      .moves .mv { padding: 5px 8px; border-top: 1px solid var(--line); cursor: pointer; display: flex; gap: 6px; align-items: center; }
      .moves .mv:hover { background: rgba(255,255,255,.06); }
      .moves .mv.active { background: rgba(88,179,104,.22); }
      .moves .mv .sym { font-size: 11px; font-weight: 800; padding: 0 5px; border-radius: 5px; color: #111; }
      .key { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .key .item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel2); cursor: pointer; }
      .key .item:hover { background: rgba(255,255,255,.08); }
      .key .item .cls { font-weight: 800; padding: 2px 8px; border-radius: 6px; color: #111; font-size: 12px; }
      .key .item .txt { color: var(--muted); font-size: 12px; flex: 1; }
      h2 { font-size: 13px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
      .hidden { display: none !important; }
      .error { color: #e08a7a; margin-top: 10px; }
      .opening { color: var(--muted); font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>♞ Chess Lens — Game Review</h1>
      <span class="sub">Full game report, computed locally with Stockfish. Paste a PGN or open a .pgn file.</span>
    </header>
    <main>
      <section>
        <div class="card import" id="import">
          <h2>Game</h2>
          <textarea id="pgn" placeholder='[Event "..."]&#10;1. e4 e5 2. Nf3 ...'></textarea>
          <div class="row">
            <input type="file" id="file" accept=".pgn,text/plain" />
            <label class="hint">Engine per move:
              <select id="strength">
                <option value="fast">Fast (depth 14, ~0.4 s)</option>
                <option value="normal" selected>Normal (depth 18, ~1 s)</option>
                <option value="deep">Deep (depth 22, ~3 s)</option>
              </select>
            </label>
            <button class="btn primary" id="run">Review game</button>
          </div>
          <div class="progress hidden" id="progress"><div id="progress-bar"></div></div>
          <div class="hint" id="status"></div>
          <div class="error hidden" id="error"></div>
        </div>

        <div class="card hidden" id="boardcard" style="margin-top: 16px">
          <div class="board-wrap">
            <div class="evalbar"><div class="w" id="evalfill"></div></div>
            <div id="board"></div>
          </div>
          <div class="nav">
            <button class="btn" id="nav-start" title="Start">«</button>
            <button class="btn" id="nav-prev" title="Previous (←)">‹</button>
            <button class="btn" id="nav-next" title="Next (→)">›</button>
            <button class="btn" id="nav-end" title="End">»</button>
            <button class="btn" id="nav-flip" title="Flip board">flip</button>
          </div>
          <div class="movenote" id="movenote"></div>
        </div>
      </section>

      <section>
        <div class="card hidden" id="report">
          <h2>Report</h2>
          <div class="summary">
            <div class="player"><div class="acc" id="acc-w">–</div><div class="name" id="name-w">White</div></div>
            <div class="vs" id="result">vs</div>
            <div class="player"><div class="acc" id="acc-b">–</div><div class="name" id="name-b">Black</div></div>
          </div>
          <div class="opening" id="opening"></div>
          <canvas class="graph" id="graph" height="120"></canvas>
          <table class="counts" id="counts"></table>
          <h2 style="margin-top: 16px">Key moments</h2>
          <div class="key" id="key"></div>
          <h2 style="margin-top: 16px">Moves</h2>
          <div class="moves" id="moves"></div>
        </div>
      </section>
    </main>
    <script src="review.js"></script>
  </body>
</html>
